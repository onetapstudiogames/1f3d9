name: Failure log export

on:
  schedule:
    - cron: '47 13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: failure-log-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out reviewed default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export the last 24 hours of 4xx and 5xx request logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: node --experimental-strip-types scripts/export-vercel-failure-logs.ts --out logs/failures
      - name: Retain the sanitized failure logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-logs-${{ github.run_id }}
          path: logs/failures/
          if-no-files-found: error
          retention-days: 90
