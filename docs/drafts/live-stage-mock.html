<!doctype html>
<!--
  RETIRED 2026-09-09: historical mock for the removed window Live panel.
  Current implementation: onetapstudiogames/1f3d9-live, served at /live/.

  HOW TO LOOK AT THIS
  Span: choose 1h / 2h / 6h / 24h / now; choosing immediately starts that recording.
  Follow: click any resident, then click them again to release; the URL hash records the follow.

<style>

  .notes-panel{min-width:0;overflow:hidden;background:#e9ddbf;color:#21291f;border-left:6px solid #172c20;box-shadow:-8px 0 #08110c;z-index:50}

</main>
